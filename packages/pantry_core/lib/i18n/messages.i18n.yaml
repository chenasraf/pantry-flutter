onboarding:
  next: Next
  back: Back
  skip: Skip
  done: Get started
  stepLabel(int current, int total): "Step ${current} of ${total}"
  welcomeNewTitle: "Welcome to Pantry"
  welcomeNewBody: "Let's take a quick tour of how Pantry works so you can get the most out of it."
  welcomeUpdateTitle: "What's new"
  welcomeUpdateBody: "Pantry has picked up a few new tricks since you last opened it. Here's a quick look at what changed."
  checklistsRedesignTitle: "Checklists got a fresh look"
  checklistsRedesignBody: "The checklist page has been rebuilt from the ground up — a cleaner layout, faster way to add items, and quick actions on every row. The next few pages walk through what's new."
  checklistSelectorTitle: "Switch lists from the top"
  checklistSelectorBody: "Tap the list name or its icon at the top of the screen to switch between lists or create a new one."
  checklistSelectorHint: "Tap to switch lists"
  mockListGroceries: "Groceries"
  mockListHardware: "Hardware store"
  mockListWeekend: "Weekend trip"
  mockItemCountSummary(int count): "${count} items"
  newListLabel: "New list"
  swipeActionsTitle: "Swipe items to manage them"
  swipeActionsBody: "Swipe a list item from right to left to reveal quick actions for editing, moving, or deleting it."
  swipeActionsHint: "Swipe left"
  swipeActionsHintBack: "Swipe right"
  quickActionsTitle: "Quick actions on every item"
  quickActionsBody: "Each item shows action buttons at its trailing edge — click one to edit, move, or delete the item without opening it."
  addItemsTitle: "A faster way to add items"
  addItemsBody: "Tap the field at the bottom to type a new item, then tag it with a category, quantity, recurrence, or photo using the chips above."
  mockComposeListName: "Groceries"
  progressHeroTitle: "Hide the progress card"
  progressHeroBody: "Don't need the progress ring at the top? Swipe it away."
  progressHeroBringBack(String toggle): "Bring it back anytime from the list menu → ${toggle}."
  progressHeroHint: "Swipe to dismiss"
  progressHeroDismissTitle: "Hide the progress card"
  progressHeroDismissBody: "Don't need the progress ring at the top? Click the X on the card to hide it."
  widgetListsTitle: "Choose lists for your widget"
  widgetListsBody: "Add the Pantry widget to your home screen to see how many items are left on each list at a glance — no need to open the app."
  widgetListsHow(String action): "Adding a widget lets you pick its lists right away. Tap ${action} on a widget to change them later, and add as many widgets as you like — each with its own lists."
  widgetListsActionLabel: "Choose lists"
  widgetListsWidgetTitle: "Pantry"
  widgetListsWidgetItemsLeft(int count): "${_plural(count, one: '1 left', many: '${count} left')}"
  widgetListsWidgetEmpty: "All done"
  pinnedNotesTitle: "Keep important notes on top"
  pinnedNotesBody: "Pin a note from its overflow menu to lock it to the top of your Notes Wall, so it stays visible above newer notes."
  mockPinnedNoteTitle: "Wi-Fi password"
  mockPinnedNoteContent: "Network: Home\nPassword: pantry-rocks"
  mockItemName: "Tomatoes"
  mockItemQuantity: "x2"
  mockItemCategory: "Produce"
  mockHardwareItemName: "Light bulbs"
  mockBulkItemThird: "Milk"
  mockBulkItemFourth: "Bread"
  allListsTitle: "Everything in one view"
  allListsBody: "Open the All lists view from the list switcher to see items from every list together. When you add an item from here, the form asks which list to put it in — pick it from the List chip."
  bulkAddTitle: "Add many items at once"
  bulkAddBody: "Flip on the Multiple toggle and the input grows into a multi-line box — every line becomes its own item. Handy when you're pasting a list or jotting down a whole grocery run."
  bulkSelectTitle: "Act on many items at once"
  bulkSelectBody: "Long-press an item — or tap Select items in the menu — to start selecting, then move, copy, set a category, or delete everything you picked in one go."
  barcodeScanTitle: "Scan a barcode to add items"
  barcodeScanBody: "Tap the scan button in the add bar and point your camera at a product's barcode. Pantry looks up the name, category and photo and fills them in for you — or type the number by hand. The first scan of a product does the lookup; after that it's instant for everyone in your house."
  barcodeScanMockName: "Coca-Cola Zero"
  barcodeScanMockCategory: "Beverages"
  priceTitle: "Add prices to your items"
  priceBody: "Give any item a price — a single amount or a range — in your currency of choice. It shows as a chip on the item, and you can filter your list by price to keep a shop on budget."
  priceMockName: "Olive oil"
  shoppingIntroTitle: "Shop store by store"
  shoppingIntroBody: "Start a shopping trip over your lists, walk each store in order, and check items off as you go — with a running price total."
  shoppingMockStoreActive: "Supermarket"
  shoppingMockStoreNext: "Pharmacy"
  categoryScopeTitle: "Categories, per list"
  categoryScopeBody: "Keep a category on a single list, or make it global so it shows up on every list. New categories stay global unless you pick a list."
  categoryScopeGlobalCaption: "Shows on every list"
  categoryScopeScopedCaption: "Shows on this list only"
  customFieldsTitle: "Fields of your own"
  customFieldsBody: "Track the details that matter to you — an expiry date, an aisle, a size. Set a field up once for the whole house or for a single list, and it shows on every item."
  customFieldsMockExpiry: "Expiry"
  customFieldsMockExpiryValue: "12 Sep"
  customFieldsMockAisle: "Aisle"
  customFieldsMockAisleValue: "Dairy"
  customFieldsTypesCaption: "Pick the type that fits what you're tracking."
  serverRequirementNote(String version): "* Requires Pantry for Nextcloud v${version}+"
  watchTitle: "Pantry on your wrist"
  watchBody: "There's a Wear OS app. Your lists, notes and photo board on the watch, working with no signal at all — and shopping trips you can walk with the phone in your pocket."
  watchHowTo(String settings, String watch): "Open Pantry on your watch and it signs in from this phone. Tips for using it live in ${settings} → ${watch}."
  joinTripTitle: "Shop a trip together"
  joinTripBody: "When someone in your house is out shopping, a banner offers you their trip instead of a second one of your own. You walk it together — whatever one of you ticks off is gone for the other."
  joinTripMockHousemate: "Dana"
  joinTripHow: "Already shopping? Joining saves your own trip to your history first. Step out of a trip you joined and it keeps running for everyone still in it."
  dev:
    showOnboarding: "Show onboarding"
    pickLastSeenTitle: "Preview what's new"
    pickLastSeenBody: "Pick the version whose what's-new you want to see, as an upgrader to that version would."
    neverSeen: "Never seen (new user)"
    forceAllFeatures: "Force-enable all features"
    sendTestNotification: "Send test notification"

notificationsIntro:
  title: Stay in the loop
  body: "Pantry can notify you when household members add items to lists, upload photos, or leave notes. Notifications are fetched from your own Nextcloud server — nothing goes through Google or third parties."
  bullet1: Household activity alerts
  bullet2: Fetched directly from your server
  bullet3: Works even when the app is closed
  enableButton: Enable notifications
  skipButton: Not now
  permissionDeniedTitle: Permission denied
  permissionDeniedBody: "You can enable notifications later in App Settings. If your device blocks them, you'll need to allow them in system settings first."
  ok: OK

