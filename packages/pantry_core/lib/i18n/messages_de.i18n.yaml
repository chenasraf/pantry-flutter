  welcomeNewTitle: "Willkommen bei Pantry"
  welcomeNewBody: "Lass uns kurz durchgehen, wie Pantry funktioniert, damit du das Beste herausholst."
  welcomeUpdateTitle: "Was ist neu"
  welcomeUpdateBody: "Seit deinem letzten Besuch hat Pantry ein paar neue Tricks gelernt. Hier ein kurzer Überblick."
  checklistsRedesignTitle: "Checklisten im neuen Look"
  checklistsRedesignBody: "Die Checklisten-Seite wurde von Grund auf neu gebaut — übersichtlicheres Layout, schnelleres Hinzufügen und Schnellaktionen für jede Zeile. Die nächsten Seiten zeigen dir, was neu ist."
  checklistSelectorTitle: "Listen oben wechseln"
  checklistSelectorBody: "Tippe auf den Listennamen oder das Symbol oben, um zwischen Listen zu wechseln oder eine neue zu erstellen."
  checklistSelectorHint: "Tippen zum Wechseln"
  mockListGroceries: "Lebensmittel"
  mockListHardware: "Baumarkt"
  mockListWeekend: "Wochenendtrip"
  mockItemCountSummary(int count): "${count} Einträge"
  newListLabel: "Neue Liste"
  swipeActionsTitle: "Einträge durch Wischen verwalten"
  swipeActionsBody: "Wische einen Listeneintrag von rechts nach links, um schnelle Aktionen zum Bearbeiten, Verschieben oder Löschen einzublenden."
  swipeActionsHint: "Nach links wischen"
  swipeActionsHintBack: "Nach rechts wischen"
  quickActionsTitle: "Schnellaktionen für jeden Eintrag"
  quickActionsBody: "Jeder Eintrag zeigt am Ende Aktions-Buttons – klicke darauf, um den Eintrag zu bearbeiten, zu verschieben oder zu löschen, ohne ihn zu öffnen."
  addItemsTitle: "Einträge schneller hinzufügen"
  addItemsBody: "Tippe auf das Feld unten, um einen neuen Eintrag einzugeben, und versieh ihn dann über die Chips darüber mit Kategorie, Menge, Wiederholung oder Foto."
  mockComposeListName: "Lebensmittel"
  progressHeroTitle: "Fortschrittskarte ausblenden"
  progressHeroBody: "Brauchst du den Fortschrittsring oben nicht? Wisch ihn einfach weg."
  progressHeroBringBack(String toggle): "Du holst sie jederzeit über das Listenmenü → ${toggle} zurück."
  progressHeroHint: "Zum Ausblenden wischen"
  progressHeroDismissTitle: "Fortschrittskarte ausblenden"
  progressHeroDismissBody: "Brauchst du den Fortschrittsring oben nicht? Klicke auf das X auf der Karte, um sie auszublenden."
  widgetListsTitle: "Listen für dein Widget auswählen"
  widgetListsBody: "Füge das Pantry-Widget zu deinem Startbildschirm hinzu, um auf einen Blick zu sehen, wie viele Einträge auf jeder Liste noch offen sind — ohne die App zu öffnen."
  widgetListsHow(String action): "Beim Hinzufügen eines Widgets wählst du direkt seine Listen. Tippe später auf ${action}, um sie zu ändern, und füge beliebig viele Widgets hinzu — jedes mit eigenen Listen."
  widgetListsActionLabel: "Listen auswählen"
  widgetListsWidgetTitle: "Pantry"
  widgetListsWidgetItemsLeft(int count): "${_plural(count, one: '1 offen', many: '${count} offen')}"
  widgetListsWidgetEmpty: "Alles erledigt"
  pinnedNotesTitle: "Wichtige Notizen oben halten"
  pinnedNotesBody: "Hefte eine Notiz über das Überlaufmenü an, damit sie oben an deiner Notizwand bleibt — über neueren Notizen sichtbar."
  mockPinnedNoteTitle: "WLAN-Passwort"
  mockPinnedNoteContent: "Netzwerk: Zuhause\nPasswort: pantry-rocks"
  mockItemName: "Tomaten"
  mockItemQuantity: "x2"
  mockItemCategory: "Gemüse"
  mockHardwareItemName: "Glühbirnen"
  mockBulkItemThird: "Milch"
  mockBulkItemFourth: "Brot"
  allListsTitle: "Alles in einer Ansicht"
  allListsBody: "Öffne die Ansicht Alle Listen über den Listenwechsler, um Einträge aus allen Listen gemeinsam zu sehen. Wenn du dort einen Eintrag hinzufügst, fragt das Formular über den Listen-Chip, in welche Liste er gehören soll."
  bulkAddTitle: "Viele Einträge auf einmal hinzufügen"
  bulkAddBody: "Aktiviere den Mehrfach-Schalter, und das Eingabefeld wird zu einem mehrzeiligen Feld — jede Zeile wird zu einem eigenen Eintrag. Praktisch, wenn du eine Liste einfügst oder einen ganzen Einkauf auf einmal notierst."
  bulkSelectTitle: "Mehrere Einträge auf einmal bearbeiten"
  bulkSelectBody: "Halte einen Eintrag gedrückt – oder tippe im Menü auf „Auswählen“ – um mehrere zu markieren, und verschiebe, kopiere, kategorisiere oder lösche sie dann alle auf einmal."
  barcodeScanTitle: "Barcode scannen, um Einträge hinzuzufügen"
  barcodeScanBody: "Tippe in der Eingabeleiste auf die Scan-Schaltfläche und richte die Kamera auf den Barcode eines Produkts. Pantry sucht Name, Kategorie und Foto heraus und füllt sie für dich aus – oder gib die Nummer von Hand ein. Der erste Scan eines Produkts führt die Suche durch; danach ist es für alle in deinem Haushalt sofort da."
  barcodeScanMockName: "Coca-Cola Zero"
  barcodeScanMockCategory: "Getränke"
  priceTitle: "Preise zu Artikeln hinzufügen"
  priceBody: "Geben Sie einem Artikel einen Preis – einen einzelnen Betrag oder eine Spanne – in der Währung Ihrer Wahl. Er erscheint als Chip am Artikel, und Sie können Ihre Liste nach Preis filtern, um im Budget zu bleiben."
  priceMockName: "Olivenöl"
  shoppingIntroTitle: "Geschäft für Geschäft einkaufen"
  shoppingIntroBody: "Starte einen Einkauf über deine Listen, gehe die Geschäfte der Reihe nach ab und hake Artikel unterwegs ab — mit laufender Preissumme."
  shoppingMockStoreActive: "Supermarkt"
  shoppingMockStoreNext: "Apotheke"
  categoryScopeTitle: "Kategorien pro Liste"
  categoryScopeBody: "Behalte eine Kategorie auf einer einzigen Liste oder mache sie global, damit sie auf jeder Liste erscheint. Neue Kategorien bleiben global, sofern du keine Liste wählst."
  categoryScopeGlobalCaption: "Erscheint auf allen Listen"
  categoryScopeScopedCaption: "Erscheint nur auf dieser Liste"
  customFieldsTitle: "Eigene Felder"
  customFieldsBody: "Erfasse die Details, die dir wichtig sind — ein Ablaufdatum, einen Gang, eine Größe. Lege ein Feld einmal für den ganzen Haushalt oder für eine einzelne Liste an, und es erscheint bei jedem Eintrag."
  customFieldsMockExpiry: "Ablauf"
  customFieldsMockExpiryValue: "12. Sep."
  customFieldsMockAisle: "Gang"
  customFieldsMockAisleValue: "Milchprodukte"
  customFieldsTypesCaption: "Wähle den Typ, der zu deinen Angaben passt."
  serverRequirementNote(String version): "* Erfordert Pantry für Nextcloud v${version}+"
  watchTitle: "Pantry am Handgelenk"
  watchBody: "Es gibt eine Wear-OS-App. Deine Listen, Notizen und die Fotowand auf der Uhr, ganz ohne Empfang — und Einkäufe, die du mit dem Telefon in der Tasche gehen kannst."
  watchHowTo(String settings, String watch): "Öffne Pantry auf deiner Uhr, und sie meldet sich über dieses Telefon an. Tipps zur Bedienung findest du unter ${settings} → ${watch}."
  joinTripTitle: "Gemeinsam einkaufen"
  joinTripBody: "Wenn jemand in deinem Haushalt gerade einkauft, bietet dir ein Banner dessen Einkauf an, statt eines zweiten eigenen. Ihr geht ihn gemeinsam durch — was eine:r von euch abhakt, ist auch für die anderen weg."
  joinTripMockHousemate: "Dana"
  joinTripHow: "Schon unterwegs? Beim Beitreten wird dein eigener Einkauf zuerst in deinem Verlauf gespeichert. Steigst du aus einem Einkauf aus, dem du beigetreten bist, läuft er für alle anderen weiter."
  dev:
    showOnboarding: "Onboarding anzeigen"
    pickLastSeenTitle: "Neuigkeiten ansehen"
    pickLastSeenBody: "Wähle die Version, deren Neuigkeiten du sehen möchtest – so, wie sie ein Nutzer beim Upgrade auf diese Version sähe."
    neverSeen: "Noch nie gesehen (neuer Benutzer)"
    forceAllFeatures: "Alle Funktionen erzwingen"
    sendTestNotification: "Testbenachrichtigung senden"

notificationsIntro:
  title: Bleib auf dem Laufenden
  body: "Pantry kann dich benachrichtigen, wenn Haushaltsmitglieder Einträge zu Listen hinzufügen, Fotos hochladen oder Notizen hinterlassen. Benachrichtigungen werden direkt von deinem Nextcloud-Server abgerufen — nichts geht über Google oder Drittanbieter."
  bullet1: "Benachrichtigungen über Haushaltsaktivitäten"
  bullet2: Direkt von deinem Server abgerufen
  bullet3: "Funktioniert auch bei geschlossener App"
  enableButton: Benachrichtigungen aktivieren
  skipButton: Nicht jetzt
  permissionDeniedTitle: Berechtigung verweigert
  permissionDeniedBody: "Du kannst Benachrichtigungen später in den App-Einstellungen aktivieren. Wenn dein Gerät sie blockiert, musst du sie zuerst in den Systemeinstellungen erlauben."
  ok: OK

