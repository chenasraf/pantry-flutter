  barcodeScanBody:
    Trykk på skanneknappen i tilleggsfeltet og rett kameraet mot strekkoden på
    eit produkt. Pantry slår opp namn, kategori og bilete og fyller dei inn for
    deg - eller skriv nummeret inn for hand. Den første skanninga av eit produkt
    gjer oppslaget, etter det er det momentant for alle i huset ditt.
