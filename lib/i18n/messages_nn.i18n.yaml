    Opne «Alle lister»-visninga frå listebytaren for å sjå oppføringar
    frå alle listene dine samla. Når du legg til ein oppføring her vil du bli spurd
    om kva liste du vil putte det i, det kan du velje frå «Liste»-brikka.
  bulkAddTitle: Legg til mange oppføringar på ein gang
  bulkAddBody:
    Slå på «fleire» og tekstfeltet blir til eit felt med fleire linjer,
    og kvar linje blir sin eigen oppføring. Nyttig når du limar inn eller skriv ned
    ei heil handleliste.
  bulkSelectTitle: Utfør handlingar på fleire oppføringar om gangen
  bulkSelectBody:
    Trykk og hald nede på ei oppføring eller trykk på «Vel oppføringar»
    i menyen for å flytte, kopiere, endre kategori eller slette alle dei valde på
    ein gang.
  barcodeScanTitle: Skann ein strekkode for å legge til oppføringar
  barcodeScanBody:
    Trykk på skanneknappen i tilleggsfeltet og rett kameraet mot strekkoden på
    eit produkt. Pantry slår opp namn, kategori og bilete og fyller dei inn for
    deg - eller skriv nummeret inn for hand. Den første skanninga av eit produkt
    gjer oppslaget, etter det er det momentant for alle i huset ditt.
