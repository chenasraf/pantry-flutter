pre-commit:
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      glob: "*.dart"
      # F-Droid build overrides depend on flutter_zxing, which isn't a
      # dependency of the default build; analyzing them per-file here (which
      # bypasses analysis_options' exclude) would fail. They're analyzed once
      # tool/fdroid/apply.sh copies the active one into lib/. See fdroid/README.md.
      exclude:
        - "fdroid/*.dart"
        - "fdroid/**/*.dart"
      run: dart analyze {staged_files}
    format-yaml:
      glob: "*.{yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    # Only fires when a pubspec (or the pinned F-Droid lock) is staged, so normal
    # commits stay fast. Verifies tool/fdroid/pubspec.lock still satisfies the
    # FLOSS pubspec — a dep change without `make fdroid-lock` would otherwise only
    # surface as a failed F-Droid build at release time. Restores the tree itself.
    fdroid-lock:
      glob: "{pubspec.yaml,pubspec.lock,tool/fdroid/pubspec.lock}"
      run: tool/fdroid/check-lock.sh
