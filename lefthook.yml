pre-commit:
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      glob: "*.dart"
      run: dart analyze {staged_files}
    format-yaml:
      glob: "*.{yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
