pre-commit:
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      glob: "*.dart"
      exclude:
        - "fdroid/*.dart"
        - "fdroid/**/*.dart"
      run: dart analyze {staged_files}
    format-yaml:
      glob: "*.{yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    fdroid-lock:
      glob: "{pubspec.yaml,pubspec.lock,tool/fdroid/pubspec.lock}"
      run: make fdroid-lock && git add tool/fdroid/pubspec.lock
