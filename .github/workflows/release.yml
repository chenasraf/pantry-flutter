name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built artifacts to (no new version cut). e.g. v0.28.0"
        required: true
        type: string
      targets:
        description: "Comma-separated platforms to build from the selected branch: android, fdroid, macos, linux, windows, ios. 'all' = every auto-release platform (android, fdroid, macos, linux, windows); pass 'ios' explicitly to force the disabled iOS build."
        required: true
        default: all
        type: string
      upload:
        description: "Upload the built artifacts to the release. Disable to test a build: artifacts are published as workflow artifacts instead of touching any release."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .flutter-version
          sparse-checkout-cone-mode: false
      - id: read
        run: echo "version=$(cat .flutter-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

  test:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # Guard the FLOSS lockfile: a dependency added or bumped in pubspec.yaml
  # without `make fdroid-lock` leaves tool/fdroid/pubspec.lock unable to satisfy
  # the swapped pubspec, which fails the F-Droid build's --enforce-lockfile step
  # at release time. Catch it on every push/PR instead.
  fdroid-lock-check:
    needs: setup
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Check F-Droid lockfile is in sync
        run: make fdroid-check

  release-please:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: chenasraf/workflows/.github/workflows/release-please-fastlane-changelog.yml@master
    with:
      release-type: dart
      scopes: |
        ios: fastlane/metadata/ios/en-US/changelogs
        macos: fastlane/metadata/macos/en-US/changelogs
        desktop: fastlane/metadata/macos/en-US/changelogs
        apple: |
          fastlane/metadata/ios/en-US/changelogs
          fastlane/metadata/macos/en-US/changelogs
        android: fastlane/metadata/android/en-US/changelogs

  build-android:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && (needs.release-please.outputs.release_created == 'true'
              || (github.event_name == 'workflow_dispatch'
                  && (inputs.targets == 'all' || contains(inputs.targets, 'android')))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Remove JNI build-id for reproducible builds
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Decode keystore
        run: echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Print signing key SHA-256
        run: |
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            -storepass ${{ secrets.ANDROID_STORE_PASSWORD }} \
            2>/dev/null | grep "SHA256:" | awk '{print $2}'

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info-aab
      - name: Rename artifacts
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          APK_DIR=build/app/outputs/flutter-apk
          mv ${APK_DIR}/app-armeabi-v7a-release.apk ${APK_DIR}/pantry-${VERSION}-armeabi-v7a.apk
          mv ${APK_DIR}/app-arm64-v8a-release.apk ${APK_DIR}/pantry-${VERSION}-arm64-v8a.apk
          mv ${APK_DIR}/app-x86_64-release.apk ${APK_DIR}/pantry-${VERSION}-x86_64.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/pantry-${VERSION}.aab

      - name: Upload APKs and App Bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          gh release upload "${{ steps.meta.outputs.tag }}" \
            build/app/outputs/flutter-apk/pantry-${VERSION}-armeabi-v7a.apk \
            build/app/outputs/flutter-apk/pantry-${VERSION}-arm64-v8a.apk \
            build/app/outputs/flutter-apk/pantry-${VERSION}-x86_64.apk \
            build/app/outputs/bundle/release/pantry-${VERSION}.aab \
            --clobber

  # FLOSS variant for F-Droid: the barcode scanner is swapped from Google ML Kit
  # (mobile_scanner) to flutter_zxing so the APK carries no proprietary code.
  # Emits -fdroid-suffixed split APKs; point the F-Droid repo at these, not the
  # default APKs above. Signed with the same keystore so they update in place.
  build-android-fdroid:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && (needs.release-please.outputs.release_created == 'true'
              || (github.event_name == 'workflow_dispatch'
                  && (inputs.targets == 'all' || contains(inputs.targets, 'fdroid')))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Apply F-Droid scanner variant
        run: tool/fdroid/apply.sh

      - name: Decode keystore
        run: echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Build one ABI at a time with --target-platform, byte-for-byte matching
      # F-Droid's per-versionCode recipe. F-Droid rebuilds each ABI in isolation
      # and compares the result against the APK uploaded here, so a plain
      # multi-ABI `--split-per-abi` build (whose per-APK output differs from the
      # isolated recipe build) fails the reproducible check. `flutter clean`
      # between ABIs keeps each build isolated too; APKs are stashed before the
      # next clean wipes build/.
      - name: Build F-Droid split APKs (per-ABI, matching the recipe)
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          # Stash outside build/ — `flutter clean` wipes the whole build/ dir.
          OUT="${RUNNER_TEMP:-/tmp}/fdroid-apks"
          mkdir -p "$OUT"
          build_one() {
            local plat="$1" abi="$2"
            flutter clean
            flutter pub get --enforce-lockfile
            flutter build apk --release --split-per-abi --target-platform="$plat"
            mv build/app/outputs/flutter-apk/app-"$abi"-release.apk \
              "$OUT/pantry-${VERSION}-fdroid-$abi.apk"
          }
          build_one android-arm   armeabi-v7a
          build_one android-arm64 arm64-v8a
          build_one android-x64   x86_64

      - name: Collect artifacts
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          mkdir -p "$APK_DIR"
          mv "${RUNNER_TEMP:-/tmp}/fdroid-apks"/*.apk "$APK_DIR"/

      - name: Upload F-Droid APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          gh release upload "${{ steps.meta.outputs.tag }}" \
            build/app/outputs/flutter-apk/pantry-${VERSION}-fdroid-armeabi-v7a.apk \
            build/app/outputs/flutter-apk/pantry-${VERSION}-fdroid-arm64-v8a.apk \
            build/app/outputs/flutter-apk/pantry-${VERSION}-fdroid-x86_64.apk \
            --clobber

  # Auto-release for iOS is TEMPORARILY DISABLED; it runs only via manual
  # workflow_dispatch when 'ios' is explicitly listed in the targets input.
  build-ios:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && contains(inputs.targets, 'ios') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/debug-info-ios
      - name: Create unsigned IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/pantry-${{ steps.meta.outputs.version }}-unsigned.ipa Payload

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            build/ios/ipa/pantry-${{ steps.meta.outputs.version }}-unsigned.ipa \
            --clobber

  # Developer ID signed + notarized macOS build for direct download from the
  # GitHub release (distributed outside the App Store). Requires the six macOS
  # signing secrets — see the DEVELOPER_ID/NOTARY_* references below.
  build-macos:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && (needs.release-please.outputs.release_created == 'true'
              || (github.event_name == 'workflow_dispatch'
                  && (inputs.targets == 'all' || contains(inputs.targets, 'macos')))) }}
    runs-on: macos-latest
    env:
      TEAM_ID: Y893L6NQP2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            macos/Pods
            ~/.cocoapods
          key: pods-macos-${{ runner.os }}-${{ hashFiles('macos/Podfile') }}
          restore-keys: pods-macos-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build & archive (Developer ID signed)
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          flutter build macos --config-only --release \
            --obfuscate --split-debug-info=build/debug-info-macos
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Pantry.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Verify signature & package DMG
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          APP="$RUNNER_TEMP/Pantry.xcarchive/Products/Applications/Pantry.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=|TeamIdentifier=" || true
          STAGE="$RUNNER_TEMP/dmg"
          DMG="$GITHUB_WORKSPACE/pantry-${VERSION}-macos.dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Pantry" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize & staple
        env:
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait --output-format json | tee "$SUBMIT_JSON"
          SUB_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$SUBMIT_JSON")"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SUBMIT_JSON")"
          echo "=== notarytool log ($STATUS) ==="
          xcrun notarytool log "$SUB_ID" \
            --key "$KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization was $STATUS — see the log above."
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Upload macOS DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "pantry-${{ steps.meta.outputs.version }}-macos.dmg" \
            --clobber

  build-linux:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && (needs.release-please.outputs.release_created == 'true'
              || (github.event_name == 'workflow_dispatch'
                  && (inputs.targets == 'all' || contains(inputs.targets, 'linux')))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      # The transitive `jni` FFI plugin compiles against the JDK headers.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        run: flutter build linux --release --obfuscate --split-debug-info=build/debug-info-linux

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          tar -czf pantry-${VERSION}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux tarball to release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            pantry-${{ steps.meta.outputs.version }}-linux-x64.tar.gz \
            --clobber

      - name: Upload Linux tarball as workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: pantry-${{ steps.meta.outputs.version }}-linux-x64
          path: pantry-${{ steps.meta.outputs.version }}-linux-x64.tar.gz

  build-windows:
    needs: [setup, release-please]
    if: >-
      ${{ always()
          && needs.setup.result == 'success'
          && (needs.release-please.outputs.release_created == 'true'
              || (github.event_name == 'workflow_dispatch'
                  && (inputs.targets == 'all' || contains(inputs.targets, 'windows')))) }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The transitive `jni` FFI plugin compiles against the JDK headers.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter-version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release --obfuscate --split-debug-info=build/debug-info-windows

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "pantry-$version-windows-x64.zip" -Force

      - name: Upload Windows zip to release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            pantry-${{ steps.meta.outputs.version }}-windows-x64.zip \
            --clobber

      - name: Upload Windows zip as workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: pantry-${{ steps.meta.outputs.version }}-windows-x64
          path: pantry-${{ steps.meta.outputs.version }}-windows-x64.zip

  post-release-comment:
    needs:
      [
        release-please,
        build-android,
        build-android-fdroid,
        build-macos,
        build-linux,
        build-windows,
      ]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Comment on release PR with asset links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${{ needs.release-please.outputs.version }}"
          REPO="${{ github.repository }}"

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          ROWS=""
          for ASSET in $ASSETS; do
            URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
            ROWS="${ROWS}| ${ASSET} | [Download](${URL}) |
          "
          done

          BODY="## Release Assets — ${TAG}

          | File | Link |
          |------|------|
          ${ROWS}"

          PR_NUMBER=$(gh pr list --state merged --json number,title --repo "$REPO" \
            --jq "[.[] | select(.title == \"chore(master): release ${VERSION}\")] | .[0].number")

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No release PR found, skipping comment"
            exit 0
          fi

          echo "Found release PR #${PR_NUMBER}"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
